name: Daily AI Investment Bot

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC
    # 08:07 KST = 23:07 UTC (previous day)
    # 10:07 KST = 01:07 UTC
    # 12:07 KST = 03:07 UTC
    # 14:07 KST = 05:07 UTC
    # 15:07 KST = 06:07 UTC
    - cron: "7 23 * * *"
    - cron: "7 1 * * *"
    - cron: "7 3 * * *"
    - cron: "7 5 * * *"
    - cron: "7 6 * * *"

permissions:
  contents: read

concurrency:
  group: daily-ai-investment-bot
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests yfinance pandas matplotlib feedparser openai

      - name: Check market briefing file
        run: |
          test -f market_brief.py
          python -m py_compile market_brief.py

      - name: Send sentiment chart
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Send market, watchlist, news and analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python market_brief.py
