name: Daily AI Investment Signal

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC
    # 08:07 KST = 23:07 UTC (previous day)
    # 10:07 KST = 01:07 UTC
    # 12:07 KST = 03:07 UTC
    # 14:07 KST = 05:07 UTC
    # 15:07 KST = 06:07 UTC
    - cron: "7 23 * * *"
    - cron: "7 1 * * *"
    - cron: "7 3 * * *"
    - cron: "7 5 * * *"
    - cron: "7 6 * * *"

permissions:
  contents: read

concurrency:
  group: daily-ai-investment-signal
  cancel-in-progress: false

jobs:
  send-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests yfinance pandas matplotlib

      - name: Check investment signal file
        run: |
          test -f bot.py
          python -m py_compile bot.py

      - name: Send AI investment signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
