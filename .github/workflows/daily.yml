name: Daily AI Investment Bot
'on': {workflow_dispatch: {}, schedule: [{cron: "0 23 * * *"}]}
permissions: {contents: read}
jobs: {send-message: {runs-on: ubuntu-latest, steps: [{name: Checkout, uses: actions/checkout@v4}, {name: Install requests, run: "python -m pip install requests yfinance"}, {name: Send Telegram message, env: {TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"}, run: "python bot.py"}]}}
